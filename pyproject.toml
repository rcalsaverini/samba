[project]
name = "samba"
version = "0.1.0"
description = "Local orchestrator that runs Claude Code on task files in git worktrees"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "typer>=0.12"]

[project.scripts]
samba = "samba.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samba"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "types-pyyaml",
    "pytest-cov>=7.1.0",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
extraPaths = ["src", "tests/fakes", "tests/component", "tests/e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fakes", "tests/component"]

[tool.coverage.run]
# Measured only on request (`uv run pytest --cov`). The end-to-end tests run `python -m samba`
# in subprocesses, so subprocess measurement is on.
source = ["samba"]
branch = true
patch = ["subprocess"]
